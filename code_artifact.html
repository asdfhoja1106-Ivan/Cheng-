<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月薪喵跑酷 - 打工日常</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
        }
        
        .pixel-font {
            font-family: 'Press Start 2P', 'Courier New', monospace;
        }

        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 select-none overflow-hidden">

    <!-- 頂部標題區 -->
    <div class="text-center mb-3">
        <h1 class="text-3xl md:text-4xl font-black tracking-wider text-amber-400 drop-shadow-md flex items-center justify-center gap-2">
            <span>🐱</span> 月薪喵跑酷：打工日常
        </h1>
        <p class="text-slate-400 text-xs md:text-sm mt-1">
            躲避職場危機！按 <span class="bg-slate-800 text-amber-300 px-2 py-0.5 rounded border border-slate-700">Space</span> / <span class="bg-slate-800 text-amber-300 px-2 py-0.5 rounded border border-slate-700">↑</span> 跳躍 ｜ 點擊螢幕也可跳躍
        </p>
    </div>

    <!-- 遊戲畫布與 UI 容器 -->
    <div class="relative rounded-2xl overflow-hidden border-4 border-slate-700 shadow-2xl bg-slate-950 max-w-full">
        <!-- 頂部資訊列 (分數、狀態) -->
        <div class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-10 bg-gradient-to-b from-slate-950/80 to-transparent pointer-events-none">
            <div class="flex flex-col gap-1">
                <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Current Salary</div>
                <div id="scoreDisplay" class="pixel-font text-lg md:text-xl text-amber-400 font-bold">$0</div>
            </div>

            <!-- 咖啡加速提示 -->
            <div id="coffeeBuff" class="hidden flex items-center gap-2 bg-amber-500/20 text-amber-300 border border-amber-500/50 px-3 py-1 rounded-full animate-pulse text-xs font-bold">
                <span>☕</span> 咖啡因高能衝刺中！
            </div>

            <div class="flex flex-col gap-1 text-right">
                <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Best Salary</div>
                <div id="highScoreDisplay" class="pixel-font text-lg md:text-xl text-emerald-400 font-bold">$0</div>
            </div>
        </div>

        <!-- 遊戲 Canvas -->
        <canvas id="gameCanvas" width="800" height="350" class="w-full max-w-[800px] h-auto block cursor-pointer"></canvas>

        <!-- 遊戲開場 Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
            <div class="text-5xl mb-4 animate-bounce">🐱💼</div>
            <h2 class="text-2xl font-bold text-white mb-2">準備好開始打工了嗎？</h2>
            <p class="text-slate-300 text-sm max-w-md mb-6 leading-relaxed">
                收集 <span class="text-yellow-400 font-bold">📄 薪資單 (+50分)</span> 增加月薪<br>
                飲用 <span class="text-amber-400 font-bold">☕ 咖啡</span> 獲得極速衝刺無敵體驗<br>
                小心躲避 <span class="text-red-400 font-bold">💼 公事包</span> 與 <span class="text-red-400 font-bold">📁 加班文件堆</span>！
            </p>
            <button id="startBtn" class="bg-amber-500 hover:bg-amber-400 active:scale-95 transition text-slate-950 font-black px-8 py-3.5 rounded-xl shadow-lg shadow-amber-500/30 text-lg tracking-wide cursor-pointer">
                開始打工 (Space / 點擊)
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
            <div class="text-5xl mb-3">💥😿</div>
            <h2 class="text-2xl font-black text-red-400 mb-1">貓生好難，崩潰下班！</h2>
            <p id="finalScoreText" class="text-slate-300 mb-6 text-base">本月賺取薪資：$0</p>
            
            <div class="flex gap-4">
                <button id="restartBtn" class="bg-amber-500 hover:bg-amber-400 active:scale-95 transition text-slate-950 font-black px-8 py-3.5 rounded-xl shadow-lg shadow-amber-500/30 text-base cursor-pointer">
                    重新打工 (Space / R)
                </button>
            </div>
        </div>
    </div>

    <!-- 底部說明標籤 -->
    <div class="mt-4 flex flex-wrap justify-center gap-4 text-xs text-slate-400 font-medium">
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span> 📄 薪資單: +$50 獎金</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-600 inline-block"></span> ☕ 咖啡: 超速衝刺 3 秒</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> ⚠️ 障礙物: 撞擊即下班</span>
    </div>

    <script>
        // 音效系統 (Web Audio API)
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playCoin() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08); // E5
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
            playCoffee() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playGameOver() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const sfx = new SoundEffects();

        // 遊戲 DOM 與 Canvas 設定
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const coffeeBuff = document.getElementById('coffeeBuff');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // 核心屬性變數
        let score = 0;
        let highScore = parseInt(localStorage.getItem('cat_game_highscore')) || 0;
        highScoreDisplay.textContent = `$${highScore}`;

        let gameSpeed = 6;
        const baseSpeed = 6;
        let isGameOver = false;
        let isGameStarted = false;
        let frameCount = 0;
        let coffeeTimer = 0; // 咖啡加速計時

        // 月薪喵物件
        const cat = {
            x: 70,
            y: 230,
            width: 44,
            height: 44,
            vy: 0,
            gravity: 0.75,
            jumpPower: -13.5,
            isJumping: false,
            legFrame: 0
        };

        let obstacles = [];
        let items = [];
        let particles = []; // 特效粒子

        // 監聽控制事件
        function triggerJump() {
            sfx.init();
            if (!isGameStarted) {
                startGame();
            } else if (!isGameOver) {
                if (!cat.isJumping) {
                    cat.vy = cat.jumpPower;
                    cat.isJumping = true;
                    sfx.playJump();
                    createParticles(cat.x + 20, cat.y + 40, '#94a3b8', 6);
                }
            } else {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                triggerJump();
            }
            if (e.code === 'KeyR' && isGameOver) {
                resetGame();
            }
        });

        canvas.addEventListener('click', (e) => {
            e.preventDefault();
            triggerJump();
        });
        startBtn.addEventListener('click', triggerJump);
        restartBtn.addEventListener('click', resetGame);

        function startGame() {
            isGameStarted = true;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            score = 0;
            gameSpeed = baseSpeed;
            isGameOver = false;
            obstacles = [];
            items = [];
            particles = [];
            cat.y = 230;
            cat.vy = 0;
            cat.isJumping = false;
            coffeeTimer = 0;
            frameCount = 0;
            
            scoreDisplay.textContent = `$${score}`;
            coffeeBuff.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
        }

        // 粒子特效生成
        function createParticles(x, y, color, count = 5) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    color: color,
                    size: Math.random() * 4 + 2,
                    life: 20
                });
            }
        }

        // 障礙物與道具生成邏輯
        function spawnObstaclesAndItems() {
            // 隨機生成障礙物
            if (frameCount % Math.max(50, 110 - Math.floor(score / 150)) === 0) {
                const types = ['briefcase', 'files', 'alarm'];
                const type = types[Math.floor(Math.random() * types.length)];
                let width = 32, height = 36, y = 240;

                if (type === 'briefcase') { width = 36; height = 28; y = 248; }
                else if (type === 'files') { width = 30; height = 40; y = 236; }
                else if (type === 'alarm') { width = 28; height = 28; y = 248; }

                obstacles.push({ x: canvas.width + 20, y, width, height, type });
            }

            // 隨機生成道具
            if (frameCount % 140 === 0) {
                const isCoffee = Math.random() < 0.35; // 35% 出現咖啡
                const type = isCoffee ? 'coffee' : 'salary';
                const y = Math.random() < 0.6 ? 160 : 210; // 兩個高度層級

                items.push({
                    x: canvas.width + 20,
                    y: y,
                    width: 28,
                    height: 28,
                    type: type,
                    floatOffset: Math.random() * Math.PI * 2
                });
            }
        }

        // 繪製月薪喵 (Pixel Art Style)
        function drawCat() {
            ctx.save();
            ctx.translate(cat.x, cat.y);

            // 跳躍時微旋轉
            if (cat.isJumping) {
                ctx.rotate(-0.1);
            }

            // 身體
            ctx.fillStyle = '#64748b'; // 上班族深灰貓
            ctx.fillRect(4, 10, 36, 26);

            // 耳朵
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.moveTo(6, 10); ctx.lineTo(12, 0); ctx.lineTo(18, 10);
            ctx.moveTo(26, 10); ctx.lineTo(32, 0); ctx.lineTo(38, 10);
            ctx.fill();

            // 耳內粉紅
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(9, 5, 4, 5);
            ctx.fillRect(29, 5, 4, 5);

            // 臉部黑眼圈 & 眼睛 (上班族疲憊感)
            ctx.fillStyle = '#334155';
            ctx.fillRect(24, 15, 12, 10); // 眼圈
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(27, 17, 7, 6);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(30, 19, 3, 4); // 瞳孔發呆

            // 腮紅
            ctx.fillStyle = '#fb7185';
            ctx.fillRect(22, 23, 4, 3);

            // 嘴巴 (無奈的一條線)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(28, 27, 8, 2);

            // 上班族識別證卡套 (藍條帶 + 黃卡包)
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(14, 22, 2, 14); // 繩子
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(11, 28, 8, 10); // 識別證

            // 四肢奔跑動畫
            ctx.fillStyle = '#334155';
            if (cat.isJumping) {
                ctx.fillRect(6, 36, 6, 8);
                ctx.fillRect(30, 34, 6, 6);
            } else {
                const legOffset = Math.sin(frameCount * 0.3) * 6;
                ctx.fillRect(8 + legOffset, 36, 6, 8);
                ctx.fillRect(28 - legOffset, 36, 6, 8);
            }

            ctx.restore();
        }

        // 繪製背景與場景
        function drawEnvironment() {
            // 背景漸層
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#0f172a');
            bgGradient.addColorStop(1, '#1e293b');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 遠景辦公室網格風線條
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            const gridOffset = (frameCount * (gameSpeed * 0.2)) % 40;
            for (let x = -gridOffset; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 280);
                ctx.stroke();
            }

            // 地板主線
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 278);
            ctx.lineTo(canvas.width, 278);
            ctx.stroke();

            // 地板滾動紋理
            ctx.fillStyle = '#475569';
            const floorOffset = (frameCount * gameSpeed) % 30;
            for (let x = -floorOffset; x < canvas.width; x += 30) {
                ctx.fillRect(x, 284, 14, 4);
            }
        }

        // 繪製障礙物
        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x, obs.y);

                if (obs.type === 'briefcase') {
                    // 公事包
                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(0, 4, obs.width, obs.height - 4);
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(2, 6, obs.width - 4, 6);
                    ctx.fillStyle = '#f59e0b'; // 金屬扣
                    ctx.fillRect(10, 14, 4, 4);
                    ctx.fillRect(22, 14, 4, 4);
                    // 把手
                    ctx.fillStyle = '#451a03';
                    ctx.fillRect(12, 0, 12, 4);
                } else if (obs.type === 'files') {
                    // 檔案文件堆
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(0, 0, obs.width, 12);
                    ctx.fillStyle = '#3b82f6';
                    ctx.fillRect(2, 12, obs.width - 4, 12);
                    ctx.fillStyle = '#10b981';
                    ctx.fillRect(1, 24, obs.width - 2, 16);
                    // 標籤頁紙張標示
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(4, 4, 10, 3);
                    ctx.fillRect(6, 16, 12, 3);
                    ctx.fillRect(5, 30, 8, 3);
                } else if (obs.type === 'alarm') {
                    // 狂吵鬧鐘
                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath();
                    ctx.arc(14, 14, 13, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(14, 14, 9, 0, Math.PI * 2);
                    ctx.fill();
                    // 指針
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(14, 14); ctx.lineTo(14, 8);
                    ctx.moveTo(14, 14); ctx.lineTo(19, 14);
                    ctx.stroke();
                }

                ctx.restore();
            });
        }

        // 繪製道具
        function drawItems() {
            items.forEach(item => {
                ctx.save();
                const floatY = item.y + Math.sin(frameCount * 0.1 + item.floatOffset) * 4;
                ctx.translate(item.x, floatY);

                if (item.type === 'salary') {
                    // 📄 薪資單
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(2, 0, 22, 28);
                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(4, 4, 18, 3);
                    ctx.fillRect(4, 10, 14, 2);
                    ctx.fillRect(4, 14, 16, 2);
                    ctx.fillRect(4, 18, 10, 2);
                    // 金錢 $ 記號
                    ctx.fillStyle = '#15803d';
                    ctx.font = 'bold 10px monospace';
                    ctx.fillText('$', 14, 25);
                } else if (item.type === 'coffee') {
                    // ☕ 外帶咖啡杯
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(4, 6, 20, 22); // 杯身
                    ctx.fillStyle = '#78350f'; // 隔熱套
                    ctx.fillRect(4, 12, 20, 8);
                    ctx.fillStyle = '#ef4444'; // 蓋子
                    ctx.fillRect(2, 2, 24, 5);
                }

                ctx.restore();
            });
        }

        // 繪製粒子
        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // 核心邏輯更新
        function update() {
            if (!isGameStarted || isGameOver) return;

            frameCount++;

            // 咖啡加速 Buff 處理
            if (coffeeTimer > 0) {
                coffeeTimer--;
                gameSpeed = baseSpeed + 4.5;
                if (coffeeTimer === 0) {
                    coffeeBuff.classList.add('hidden');
                }
            } else {
                gameSpeed = baseSpeed + Math.min(6, Math.floor(score / 300));
            }

            // 月薪喵重力與跳躍計算
            cat.vy += cat.gravity;
            cat.y += cat.vy;

            if (cat.y >= 230) {
                cat.y = 230;
                cat.vy = 0;
                cat.isJumping = false;
            }

            // 生成元素
            spawnObstaclesAndItems();

            // 更新障礙物與碰撞
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;

                // AABB 碰撞檢測 (判定容錯調整)
                if (
                    cat.x + 8 < obs.x + obs.width &&
                    cat.x + cat.width - 8 > obs.x &&
                    cat.y + 8 < obs.y + obs.height &&
                    cat.y + cat.height > obs.y
                ) {
                    // 如果在咖啡無敵衝刺狀態，可衝碎障礙物
                    if (coffeeTimer > 0) {
                        sfx.playCoin();
                        createParticles(obs.x + obs.width/2, obs.y + obs.height/2, '#f59e0b', 12);
                        obstacles.splice(i, 1);
                        score += 20;
                        scoreDisplay.textContent = `$${score}`;
                        continue;
                    }

                    // 碰撞失敗 Game Over
                    isGameOver = true;
                    sfx.playGameOver();
                    createParticles(cat.x + 20, cat.y + 20, '#ef4444', 15);
                    
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('cat_game_highscore', highScore);
                        highScoreDisplay.textContent = `$${highScore}`;
                    }

                    finalScoreText.textContent = `本月成功賺取薪資：$${score}`;
                    gameOverOverlay.classList.remove('hidden');
                }

                // 移除邊界外障礙物並加基本分數
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreDisplay.textContent = `$${score}`;
                }
            }

            // 更新道具與碰撞檢測
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.x -= gameSpeed;

                if (
                    cat.x < item.x + item.width &&
                    cat.x + cat.width > item.x &&
                    cat.y < item.y + item.height &&
                    cat.y + cat.height > item.y
                ) {
                    if (item.type === 'salary') {
                        score += 50;
                        sfx.playCoin();
                        createParticles(item.x, item.y, '#eab308', 10);
                    } else if (item.type === 'coffee') {
                        coffeeTimer = 200; // 約 3.5 秒加速無敵
                        coffeeBuff.classList.remove('hidden');
                        sfx.playCoffee();
                        createParticles(item.x, item.y, '#3b82f6', 10);
                    }
                    scoreDisplay.textContent = `$${score}`;
                    items.splice(i, 1);
                } else if (item.x + item.width < 0) {
                    items.splice(i, 1);
                }
            }
        }

        // 主畫面渲染 Loop
        function render() {
            drawEnvironment();
            drawObstacles();
            drawItems();
            drawParticles();
            drawCat();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // 啟動遊戲引擎
        gameLoop();
    </script>
</body>
</html>
